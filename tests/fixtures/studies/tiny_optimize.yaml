# Tiny optimisation study on the minimal vehicle: 2 design parameters, 2 constraints,
# 2 objectives, short sweeps. Used by the driver tests (fast, workers: 1).
schema: 1
vehicle: ../minimal_vehicle.yaml

variables:
  - point: front.tie_inner
    domain: {offset: {x: [-15 mm, 15 mm], z: [-15 mm, 15 mm]}}

sweeps:
  bump_f: {kind: corner, corner: FL, travel: [-30 mm, 30 mm], steps: 7}

constraints:
  - {name: mr_static, type: value, sweep: bump_f, metric: mr_spring, at: 0 mm, min: 0.3, max: 1.5}
  - {name: camber_band, type: band, sweep: bump_f, metric: camber, min: -5 deg, max: 5 deg}

objectives:
  - name: camber_curve
    type: curve
    sweep: bump_f
    metric: camber
    target: {x: [-30 mm, 0 mm, 30 mm], y: [-1.6 deg, -0.6 deg, 0.3 deg]}
    where: [-25 mm, 25 mm]
    scale: 0.1 deg
  - {name: mr_target, type: target, sweep: bump_f, metric: mr_spring, at: 0 mm, target: 0.6, scale: 0.05}

optimizer:
  mode: weighted
  method: de+slsqp
  seed: 1
  workers: 1
  budget: {evaluations: 40, time: 10 min}
  start: baseline
  options: {popsize: 4}
