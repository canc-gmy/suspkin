[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "suspkin"
version = "1.0.0"
description = "Suspension kinematics toolkit for Formula Student double-wishbone pushrod cars"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "matplotlib>=3.9",
    "typer>=0.12",
]

[project.optional-dependencies]
viz = ["plotly>=5.22"]
opt = ["pymoo>=0.6.1"]
app = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
surrogate = ["torch>=2.5,<2.7", "optuna>=4.0"]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "types-PyYAML",
    "pandas-stubs",
    "pytest-cov>=7.1.0",
    "httpx>=0.27",
]
docs = [
    "mkdocs-material>=9.5,<10",
    "mkdocstrings[python]>=0.26",
]

[project.scripts]
suspkin = "suspkin.cli:app"

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/suspkin"]
# built frontend (git-ignored) must still ship in the wheel
artifacts = ["src/suspkin/app/static/**", "src/suspkin/app/static_single/**"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.md"]  # ruff >= 0.17 formats Markdown code blocks; docs are hand-written

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "NPY", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["scipy.*", "matplotlib.*", "plotly.*", "pymoo.*", "optuna.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "perf: wall-clock performance guard (machine dependent, generous limits)",
    "examples: runs the scripts in examples/ (slow, subprocess)",
]

[tool.coverage.run]
source = ["suspkin"]
branch = false

[tool.coverage.report]
fail_under = 94
show_missing = true
skip_covered = true
