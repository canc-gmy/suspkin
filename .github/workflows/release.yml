name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Verify tag matches pyproject version
        run: |
          python - <<'PY'
          import os, sys, tomllib
          with open("pyproject.toml", "rb") as f:
              version = tomllib.load(f)["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              sys.exit(f"Tag {tag} does not match pyproject version v{version}")
          PY
      - name: Verify the tagged commit is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Tagged commit $GITHUB_SHA is not contained in origin/main"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run build:single
        working-directory: frontend
      - run: uv sync --all-extras
      - run: uv run pytest -q -m "not examples"
      - run: uv build
      - name: Verify the web app is packaged
        run: uv run python scripts/check_dist_frontend.py dist/*.whl dist/*.tar.gz
      - name: Extract release notes from CHANGELOG
        run: |
          python - <<'PY'
          import os, re, sys
          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.S | re.M
          )
          if not m:
              sys.exit(f"No CHANGELOG section for {version}")
          open("release_notes.md", "w", encoding="utf-8").write(m.group(1).strip() + "\n")
          PY
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.whl
            dist/*.tar.gz
