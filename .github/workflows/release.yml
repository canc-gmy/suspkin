name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Verify tag matches pyproject version
        run: |
          python - <<'PY'
          import os, sys, tomllib
          with open("pyproject.toml", "rb") as f:
              version = tomllib.load(f)["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              sys.exit(f"Tag {tag} does not match pyproject version v{version}")
          PY
      - run: uv build
      - name: Extract release notes from CHANGELOG
        run: |
          python - <<'PY'
          import os, re, sys
          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.S | re.M
          )
          if not m:
              sys.exit(f"No CHANGELOG section for {version}")
          open("release_notes.md", "w", encoding="utf-8").write(m.group(1).strip() + "\n")
          PY
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: dist/*
