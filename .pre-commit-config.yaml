repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check --fix
        entry: python -m uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: python -m uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy src
        entry: python -m uv run mypy src
        language: system
        types: [python]
        pass_filenames: false
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^tests/regression/behaviour/snapshots/
      - id: end-of-file-fixer
        exclude: ^tests/regression/behaviour/snapshots/
      - id: check-yaml
      - id: check-toml
      - id: mixed-line-ending
        args: ["--fix=lf"]
