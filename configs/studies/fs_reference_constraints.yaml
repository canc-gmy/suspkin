# Reference constraint study for configs/vehicles/fs_reference.yaml (schema 1).
#
# Units: every quantity is a number in SI (m, rad, N, N/m) or a string with a unit
# ("20 mm", "2 deg", "0.05 deg/mm", "35 N/mm", "50 %"). Blocks that carry `units: mm`
# apply it to every coordinate in the block. Frame: ISO 8855 (x forward, y left, z up,
# origin on the ground at the middle of the front axle). Variables move the LEFT point;
# the right side mirrors it.
#
# Hexahedron vertex order (FEM convention): vertices 0-1-2-3 are the bottom face,
# counter-clockwise seen from +z; vertices 4-5-6-7 are the top face, each above the
# vertex of the same position in the bottom face (4 above 0, 5 above 1, ...). The
# hexahedron must be convex and not twisted (positive Jacobian at all corners).
#
# The baseline vehicle passes every constraint below with a margin.

schema: 1
vehicle: ../vehicles/fs_reference.yaml

variables:
  # Front UCA front chassis pivot: skewed hexahedron (top face shifted outboard and
  # tapered), roughly +-18 mm around the baseline point (130, 300, 325) mm.
  - point: front.uca_front
    domain:
      hexahedron:
        units: mm
        vertices:
          - [112, 282, 307]
          - [148, 282, 307]
          - [148, 318, 307]
          - [112, 318, 307]
          - [116, 288, 343]
          - [144, 288, 343]
          - [144, 324, 343]
          - [116, 324, 343]

  # Front UCA rear chassis pivot: skewed hexahedron around (-130, 300, 325) mm.
  - point: front.uca_rear
    domain:
      hexahedron:
        units: mm
        vertices:
          - [-148, 282, 307]
          - [-112, 282, 307]
          - [-112, 318, 307]
          - [-148, 318, 307]
          - [-152, 286, 343]
          - [-116, 286, 343]
          - [-116, 322, 343]
          - [-152, 322, 343]

  # Front tie-rod inner end on the rack: axis-aligned box around (85, 150, 154) mm.
  - point: front.tie_inner
    domain: {box: {min: [70, 135, 139], max: [100, 165, 169], units: mm}}

  # Rear pushrod outer end on the UCA: offset from the baseline point (x and z only).
  - point: rear.pushrod_outer
    domain: {offset: {x: [-10 mm, 10 mm], z: [-8 mm, 8 mm]}}

sweeps:
  bump_f: {kind: corner, corner: FL, travel: [-30 mm, 30 mm], steps: 13}
  bump_r: {kind: corner, corner: RL, travel: [-30 mm, 30 mm], steps: 13}
  roll: {kind: vehicle, input: roll, range: [-2 deg, 2 deg], steps: 9}
  steer: {kind: vehicle, input: rack, range: full, steps: 9}

constraints:
  # --- sweep metrics -------------------------------------------------------------------
  - {name: camber_band_f, type: band, sweep: bump_f, metric: camber, where: [-25 mm, 25 mm], min: -4 deg, max: 0 deg, scale: 1 deg, note: "Front camber stays negative and below 4 deg over usable travel"}
  - {name: toe_band_f, type: band, sweep: bump_f, metric: toe, where: [-25 mm, 25 mm], min: -0.5 deg, max: 0.5 deg, scale: 0.1 deg, note: "Front bump steer envelope"}
  - {name: camber_gain_f, type: slope, sweep: bump_f, metric: camber, min: -0.05 deg/mm, max: 0.0 deg/mm, note: "Front camber gain in bump (negative = more negative camber)"}
  - {name: bump_steer_r, type: slope, sweep: bump_r, metric: toe, min: -0.02 deg/mm, max: 0.02 deg/mm, note: "Rear toe change per mm of travel"}
  - {name: roll_camber_f, type: slope, sweep: roll, metric: FL_camber_ground, min: -1.1 deg/deg, max: -0.5 deg/deg, note: "Front wheel camber change vs body roll (negative: left-up roll adds negative camber at FL)"}
  - {name: mr_front, type: value, sweep: bump_f, metric: mr_spring, at: 0 mm, min: 0.9, max: 1.1, note: "Front spring motion ratio near unity"}
  - {name: mr_rear, type: value, sweep: bump_r, metric: mr_spring, at: 0 mm, min: 0.9, max: 1.1, note: "Rear spring motion ratio near unity"}

  # --- reach and joints ----------------------------------------------------------------
  - {name: travel_f, type: reach, corner: FL, travel: [-30 mm, 30 mm], min_toggle_margin: 20 deg, stroke: true, note: "Front corner reaches full travel within coilover stroke and rocker toggle margin"}
  - {name: travel_r, type: reach, corner: RL, travel: [-30 mm, 30 mm], min_toggle_margin: 20 deg, stroke: true, note: "Same for the rear corner"}
  - {name: ubj_angle, type: joint_angle, corner: FL, joint: uca_outer, sweep: bump_f, max: 25 deg, note: "Upper ball joint articulation limit"}

  # --- vehicle summary -----------------------------------------------------------------
  - {name: rc_height_f, type: summary, metric: front.rc_height, min: 10 mm, max: 80 mm, note: "Front roll centre height"}
  - {name: roll_gradient, type: summary, metric: roll_gradient, max: 1.2 deg/g, note: "Roll gradient at the reference lateral acceleration"}
  - {name: tlltd_front, type: summary, metric: tlltd_front, min: 0.45, max: 0.60, note: "Front share of total lateral load transfer distribution"}

  # --- packaging regions ---------------------------------------------------------------
  - name: uca_front_keepout
    type: outside
    point: front.uca_front
    region: {sphere: {center: [0.13, 0.40, 0.46], radius: 30 mm}}
    over: bump_f
    note: "Keep the front UCA pivot away from a spherical frame feature"
  - name: tie_inner_tube
    type: outside
    point: front.tie_inner
    region: {cylinder: {p0: [0.02, 0.10, 0.20], p1: [0.02, 0.30, 0.20], radius: 25 mm}}
    note: "Keep the rack end clear of a transverse frame tube"
  - name: uca_front_zone
    type: inside
    point: front.uca_front
    region: {box: {min: [0.09, 0.26, 0.28], max: [0.17, 0.34, 0.37]}}
    note: "UCA front pivot must stay inside the upper rail envelope"
  - name: uca_rear_zone
    type: inside
    point: front.uca_rear
    region:
      hexahedron:
        - [-0.17, 0.26, 0.28]
        - [-0.09, 0.26, 0.28]
        - [-0.09, 0.34, 0.28]
        - [-0.17, 0.34, 0.28]
        - [-0.17, 0.26, 0.37]
        - [-0.09, 0.26, 0.37]
        - [-0.09, 0.34, 0.37]
        - [-0.17, 0.34, 0.37]
    note: "UCA rear pivot must stay inside the upper rail envelope"

  # --- distances and relations ---------------------------------------------------------
  - {name: tie_len, type: distance, a: front.tie_inner, b: front.tie_outer, min: 400 mm, note: "Minimum tie-rod length"}
  - {name: uca_base, type: distance, a: front.uca_front, b: front.uca_rear, min: 200 mm, note: "Minimum UCA chassis base"}
  - {name: uca_above_lca, type: relation, lhs: front.uca_front.z, op: ">=", rhs: front.lca_front.z, offset: 100 mm, note: "UCA pivot at least 100 mm above the LCA pivot"}
